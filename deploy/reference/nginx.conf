events {}
http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=identity:10m rate=3r/s;
    limit_req_status 429;
    log_format safe '$remote_addr $request_method $uri $status $request_time $upstream_addr';
    access_log /dev/stdout safe;
    server {
        listen 8443 ssl;
        ssl_certificate /tls/cert.pem;
        ssl_certificate_key /tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 32k;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        set $api http://api:8080;

        location ~ ^/api/v1/(auth|oidc)/ {
            limit_req zone=identity burst=12 nodelay;
            proxy_pass $api;
        }

        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass $api;
        }
    }
}
