name: Build and integration tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - run: docker compose up -d --wait database mail
      - run: dotnet restore --locked-mode
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet format whitespace --no-restore --verify-no-changes
      - run: ./scripts/db.sh check Identity
      - run: ./scripts/db.sh check Notes
      - run: ./scripts/db.sh check Tenancy
      - run: ./scripts/db.sh check Jobs
      - if: ${{ hashFiles('.template.config/template.json') != '' }}
        run: |
          ./scripts/new-project.sh Example.Inventory "$RUNNER_TEMP/Example.Inventory"
          cd "$RUNNER_TEMP/Example.Inventory"
          ./scripts/new-service.sh InventoryReports
          dotnet restore --locked-mode
          dotnet build --configuration Release --no-restore
      - run: docker compose build migrate
