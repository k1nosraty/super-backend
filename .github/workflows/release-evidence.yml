name: Release evidence
on:
  push:
    branches: ['release-acceptance/**']
  workflow_dispatch:
    inputs:
      previous:
        description: Previous released commit or tag
        required: true
        default: 9c587e2d820635b2ecd98994bf6667a2f48f5da4
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_IMAGE: superbackend-release:candidate
      PREVIOUS_IMAGE: superbackend-release:previous
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.404'
      - name: Prepare artifacts and build both images
        env:
          PREVIOUS_REF: ${{ inputs.previous || '9c587e2d820635b2ecd98994bf6667a2f48f5da4' }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/previous"
          previous="$(git rev-parse --verify --end-of-options "$PREVIOUS_REF^{commit}")"
          git archive "$previous" | tar -x -C "$RUNNER_TEMP/previous"
          printf 'Candidate: %s\nPrevious: %s\n' "$GITHUB_SHA" "$previous" > "$RUNNER_TEMP/evidence/source.txt"
          ./scripts/build-release-image.sh "$RUNNER_TEMP/previous" "$PREVIOUS_IMAGE"
          ./scripts/build-release-image.sh . "$API_IMAGE"
      - run: docker compose up -d --wait database mail
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore --logger 'trx;LogFileName=release.trx' --results-directory "$RUNNER_TEMP/evidence"
      - run: ./scripts/check-generated.sh
      - name: Run TLS, browser, migration and recovery rehearsals
        run: |
          browser="$RUNNER_TEMP/browser"
          mkdir -p "$browser"
          npm install --prefix "$browser" --save-exact playwright@1.56.1
          "$browser/node_modules/.bin/playwright" install --with-deps chromium
          export PLAYWRIGHT_DIRECTORY="$browser"
          baseline="$PREVIOUS_IMAGE"
          REHEARSAL_EVIDENCE_FILE="$RUNNER_TEMP/evidence/fresh.json" PREVIOUS_IMAGE= ./scripts/rehearse-release.sh
          REHEARSAL_NOTE_SAMPLES=120 REHEARSAL_NOTE_RATE=10 REHEARSAL_POOL_DRILL=true \
            REHEARSAL_EVIDENCE_FILE="$RUNNER_TEMP/evidence/upgrade.json" PREVIOUS_IMAGE="$baseline" ./scripts/rehearse-release.sh
      - name: Record transitive NuGet advisories
        if: ${{ success() }}
        run: dotnet list package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/evidence/nuget-advisories.json"
      - name: Scan candidate image
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: superbackend-release:candidate
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: json
          output: ${{ runner.temp }}/evidence/image-vulnerabilities.json
      - name: Upload release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: ${{ runner.temp }}/evidence/
