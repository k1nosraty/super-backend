services:
  database:
    image: postgres:18.6
    environment:
      POSTGRES_DB: superbackend
      POSTGRES_USER: superbackend
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbackend -d superbackend"]
      interval: 2s
      timeout: 3s
      retries: 20
  mail:
    image: ghcr.io/axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:10250:1025"
      - "127.0.0.1:8025:8025"
  migrate:
    image: super-backend:local
    build: .
    command: ["--migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Main: "Host=database;Port=5432;Database=superbackend;Username=superbackend;Password=local-dev-only;GSS Encryption Mode=Disable"
      Smtp__Host: mail
      Smtp__Port: "1025"
      DataProtection__KeyDirectory: /keys
    depends_on:
      database:
        condition: service_healthy
  api:
    image: super-backend:local
    pull_policy: never
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - keys:/keys
volumes:
  database:
  keys:
